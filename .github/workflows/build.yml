name: Build (Windows, Release Win32)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        # The wxWidgets submodule is not needed: prebuilt 3.1.3 binaries are downloaded below.

      - uses: microsoft/setup-msbuild@v2

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-wx313-vc14x-fbx202001-v1

      - name: Download wxWidgets 3.1.3 (prebuilt, vc14x, 32-bit DLL)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force deps\wx | Out-Null
          $base = "https://github.com/wxWidgets/wxWidgets/releases/download/v3.1.3"
          foreach ($f in "wxWidgets-3.1.3-headers.7z", "wxMSW-3.1.3_vc14x_Dev.7z", "wxMSW-3.1.3_vc14x_ReleaseDLL.7z") {
            Invoke-WebRequest "$base/$f" -OutFile "deps\$f"
            7z x "deps\$f" "-odeps\wx" -y | Out-Null
            Remove-Item "deps\$f"
          }

      - name: Download FBX SDK 2020.0.1
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = "Continue"
          $ok = $false
          # 1st choice: NuGet package (scriptable download)
          try {
            Invoke-WebRequest "https://www.nuget.org/api/v2/package/fbxsdk/2020.0.1.2" -OutFile deps\fbxsdk.zip -ErrorAction Stop
            Expand-Archive deps\fbxsdk.zip deps\fbx-nuget -Force
            Remove-Item deps\fbxsdk.zip
            Write-Host "NuGet package libraries:"
            Get-ChildItem -Recurse deps\fbx-nuget -Include *.lib, *.dll | ForEach-Object { $_.FullName }
            $ok = @(Get-ChildItem -Recurse deps\fbx-nuget -Filter libfbxsdk-md.lib | Where-Object { $_.FullName -match '\\(x86|win32)\\' }).Count -gt 0
          } catch { Write-Host "NuGet download failed: $_" }
          # Fallback: Autodesk's own installer (NSIS, silent install)
          if (-not $ok) {
            Write-Host "No 32-bit libfbxsdk-md.lib in the NuGet package; trying the Autodesk installer"
            $url = "https://www.autodesk.com/content/dam/autodesk/www/adn/fbx/2020-0-1/fbx202001_fbxsdk_vs2017_win.exe"
            Invoke-WebRequest $url -OutFile deps\fbxsdk.exe -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -ErrorAction Stop
            $dest = Join-Path $PWD "deps\fbx-install"
            Start-Process deps\fbxsdk.exe -ArgumentList "/S", "/D=$dest" -Wait
            Remove-Item deps\fbxsdk.exe
          }

      - name: Locate FBX SDK
        id: fbx
        run: |
          $hdr = Get-ChildItem -Recurse deps -Filter fbxsdk.h | Where-Object { $_.Directory.Name -eq 'include' } | Select-Object -First 1
          $lib = Get-ChildItem -Recurse deps -Filter libfbxsdk-md.lib | Where-Object { $_.FullName -match '\\(x86|win32)\\' -and $_.FullName -match '\\release\\' } | Select-Object -First 1
          if (-not $hdr -or -not $lib) {
            Write-Host "Found these candidates:"
            Get-ChildItem -Recurse deps -Include fbxsdk.h, *.lib | Where-Object { $_.FullName -notmatch '\\wx\\' } | ForEach-Object { $_.FullName }
            throw "FBX SDK headers or 32-bit release libfbxsdk-md.lib not found"
          }
          foreach ($extra in "libxml2-md.lib", "zlib-md.lib") {
            if (-not (Test-Path (Join-Path $lib.Directory.FullName $extra))) { Write-Host "::warning::$extra not next to libfbxsdk-md.lib" }
          }
          Write-Host "FBX root: $($hdr.Directory.Parent.FullName)"
          Write-Host "FBX libs: $($lib.Directory.FullName)"
          "root=$($hdr.Directory.Parent.FullName)" >> $env:GITHUB_OUTPUT
          "lib=$($lib.Directory.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build
        run: |
          $wx = Join-Path $PWD "deps\wx"
          msbuild Hades-Workshop.vcxproj /m /nologo /v:minimal `
            /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 `
            "/p:HwWxDir=$wx" "/p:HwWxLibDir=$wx\lib\vc14x_dll" `
            "/p:HwFbxDir=${{ steps.fbx.outputs.root }}" "/p:HwFbxLibDir=${{ steps.fbx.outputs.lib }}" `
            "/p:HwExtraDefines=wxMSVC_VERSION_ABI_COMPAT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          $exe = Get-ChildItem -Recurse -Filter HadesWorkshop.exe | Where-Object { $_.FullName -notmatch '\\deps\\' } | Select-Object -First 1
          if (-not $exe) { throw "HadesWorkshop.exe not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist\
          Copy-Item deps\wx\lib\vc14x_dll\*.dll dist\
          Get-ChildItem dist | ForEach-Object { "$($_.Name)  $($_.Length)" }

      - name: Smoke test headless mode
        run: |
          function Run-Hw([string]$name, [string]$commands, [int]$expected) {
            Set-Content "$name.txt" $commands
            $p = Start-Process dist\HadesWorkshop.exe -ArgumentList "-q", "-i", "$name.txt", "-o", "$name.log" -PassThru
            $null = $p.Handle  # needed for ExitCode to be available after the process ends
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "$name : timed out (window or popup blocking?)" }
            Write-Host "--- $name (exit $($p.ExitCode)) ---"
            if (Test-Path "$name.log") { Get-Content "$name.log" }
            if ($p.ExitCode -ne $expected) { throw "$name : expected exit code $expected, got $($p.ExitCode)" }
            return (Get-Content "$name.log" -Raw)
          }
          $log = Run-Hw "help" "help" 0
          if ($log -notmatch "get FIELDNAME") { throw "help output is missing the get command" }
          Run-Hw "bad_open" "open C:\does\not\exist\FF9_Launcher.exe" 1 | Out-Null
          Write-Host "Smoke tests passed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HadesWorkshop-agent-cli
          path: dist
          if-no-files-found: ignore
