name: Build (Windows, Release Win32)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        # The wxWidgets submodule is not needed: prebuilt 3.1.3 binaries are downloaded below.
        # Built without the Autodesk FBX SDK (/p:HwNoFbx=true): Autodesk blocks scripted downloads,
        # and FBX is only used for 3D model import/export, which batch mode doesn't use.

      - uses: microsoft/setup-msbuild@v2

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-wx313-vc14x-v1

      - name: Download wxWidgets 3.1.3 (prebuilt, vc14x, 32-bit DLL)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force deps\wx | Out-Null
          $base = "https://github.com/wxWidgets/wxWidgets/releases/download/v3.1.3"
          foreach ($f in "wxWidgets-3.1.3-headers.7z", "wxMSW-3.1.3_vc14x_Dev.7z", "wxMSW-3.1.3_vc14x_ReleaseDLL.7z") {
            Invoke-WebRequest "$base/$f" -OutFile "deps\$f"
            7z x "deps\$f" "-odeps\wx" -y | Out-Null
            Remove-Item "deps\$f"
          }

      - name: Build
        run: |
          $wx = Join-Path $PWD "deps\wx"
          msbuild Hades-Workshop.vcxproj /m /nologo /v:minimal `
            /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 `
            "/p:HwWxDir=$wx" "/p:HwWxLibDir=$wx\lib\vc14x_dll" `
            /p:HwNoFbx=true `
            "/p:HwExtraDefines=wxMSVC_VERSION_ABI_COMPAT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          $exe = Get-ChildItem -Recurse -Filter HadesWorkshop.exe | Where-Object { $_.FullName -notmatch '\\deps\\' } | Select-Object -First 1
          if (-not $exe) { throw "HadesWorkshop.exe not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist\
          Get-ChildItem deps\wx\lib\vc14x_dll\*.dll | Where-Object { $_.Name -notmatch "ud_" } | Copy-Item -Destination dist\
          Get-ChildItem dist | ForEach-Object { "$($_.Name)  $($_.Length)" }

      - name: Smoke test headless mode
        run: |
          # Crash dialogs would hang the run: make crashes exit immediately with their exception code instead
          New-Item -Force "HKCU:\Software\Microsoft\Windows\Windows Error Reporting" | Out-Null
          Set-ItemProperty "HKCU:\Software\Microsoft\Windows\Windows Error Reporting" DontShowUI 1
          New-Item -ItemType Directory -Force diag | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screenshot([string]$file) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($file); $g.Dispose(); $bmp.Dispose()
          }
          $failures = @()
          function Run-Hw([string]$name, [string]$commands, [int]$expected, [string[]]$flags = @("-q")) {
            Set-Content "$name.txt" $commands
            $args = $flags + @("-i", "$name.txt", "-o", "$name.log")
            $p = Start-Process dist\HadesWorkshop.exe -ArgumentList $args -PassThru
            $null = $p.Handle  # needed for ExitCode to be available after the process ends
            $exited = $p.WaitForExit(60000)
            if (-not $exited) {
              $p.Refresh()
              Write-Host "--- $name : TIMED OUT; main window title: '$($p.MainWindowTitle)'"
              Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { Write-Host "    window: $($_.ProcessName) '$($_.MainWindowTitle)'" }
              Save-Screenshot "diag\$name-timeout.png"
              $p.Kill()
            } else {
              Write-Host ("--- $name : exit code {0} (0x{0:X8})" -f $p.ExitCode)
            }
            if (Test-Path "$name.log") { Write-Host "    log:"; Get-Content "$name.log" | ForEach-Object { "      $_" } } else { Write-Host "    (no log file)" }
            Copy-Item "$name.*" diag\ -ErrorAction SilentlyContinue
            if (-not $exited) { $script:failures += "$name timed out"; return "" }
            if ($p.ExitCode -ne $expected) { $script:failures += "$name exit code $($p.ExitCode), expected $expected" }
            if (Test-Path "$name.log") { return (Get-Content "$name.log" -Raw) } else { return "" }
          }
          # Control: original (non-headless) batch mode, ends with 'exit'
          Run-Hw "control_windowed" "help`nexit" 0 @() | Out-Null
          $log = Run-Hw "help" "help" 0
          if ($log -notmatch "get FIELDNAME") { $failures += "help output is missing the get command" }
          Run-Hw "bad_open" "open C:\does\not\exist\FF9_Launcher.exe" 1 | Out-Null
          if ($failures.Count -gt 0) { $failures | ForEach-Object { Write-Host "FAIL: $_" }; exit 1 }
          Write-Host "Smoke tests passed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-diagnostics
          path: diag
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HadesWorkshop-agent-cli
          path: dist
          if-no-files-found: ignore
