name: Build (Windows, Release Win32)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        # The wxWidgets submodule is not needed: prebuilt 3.1.3 binaries are downloaded below.
        # Built without the Autodesk FBX SDK (/p:HwNoFbx=true): Autodesk blocks scripted downloads,
        # and FBX is only used for 3D model import/export, which batch mode doesn't use.

      - uses: microsoft/setup-msbuild@v2

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-wx313-vc14x-v1

      - name: Download wxWidgets 3.1.3 (prebuilt, vc14x, 32-bit DLL)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force deps\wx | Out-Null
          $base = "https://github.com/wxWidgets/wxWidgets/releases/download/v3.1.3"
          foreach ($f in "wxWidgets-3.1.3-headers.7z", "wxMSW-3.1.3_vc14x_Dev.7z", "wxMSW-3.1.3_vc14x_ReleaseDLL.7z") {
            Invoke-WebRequest "$base/$f" -OutFile "deps\$f"
            7z x "deps\$f" "-odeps\wx" -y | Out-Null
            Remove-Item "deps\$f"
          }

      - name: Build
        run: |
          $wx = Join-Path $PWD "deps\wx"
          msbuild Hades-Workshop.vcxproj /m /nologo /v:minimal `
            /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 `
            "/p:HwWxDir=$wx" "/p:HwWxLibDir=$wx\lib\vc14x_dll" `
            /p:HwNoFbx=true `
            "/p:HwExtraDefines=wxMSVC_VERSION_ABI_COMPAT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          $exe = Get-ChildItem -Recurse -Filter HadesWorkshop.exe | Where-Object { $_.FullName -notmatch '\\deps\\' } | Select-Object -First 1
          if (-not $exe) { throw "HadesWorkshop.exe not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist\
          Copy-Item deps\wx\lib\vc14x_dll\*.dll dist\
          Get-ChildItem dist | ForEach-Object { "$($_.Name)  $($_.Length)" }

      - name: Smoke test headless mode
        run: |
          function Run-Hw([string]$name, [string]$commands, [int]$expected) {
            Set-Content "$name.txt" $commands
            $p = Start-Process dist\HadesWorkshop.exe -ArgumentList "-q", "-i", "$name.txt", "-o", "$name.log" -PassThru
            $null = $p.Handle  # needed for ExitCode to be available after the process ends
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "$name : timed out (window or popup blocking?)" }
            Write-Host "--- $name (exit $($p.ExitCode)) ---"
            if (Test-Path "$name.log") { Get-Content "$name.log" }
            if ($p.ExitCode -ne $expected) { throw "$name : expected exit code $expected, got $($p.ExitCode)" }
            return (Get-Content "$name.log" -Raw)
          }
          $log = Run-Hw "help" "help" 0
          if ($log -notmatch "get FIELDNAME") { throw "help output is missing the get command" }
          Run-Hw "bad_open" "open C:\does\not\exist\FF9_Launcher.exe" 1 | Out-Null
          Write-Host "Smoke tests passed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HadesWorkshop-agent-cli
          path: dist
          if-no-files-found: ignore
